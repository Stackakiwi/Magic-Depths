function fr(a,b,w,h,c0){x.fillStyle=c0;x.fillRect(Math.round(a),Math.round(b),Math.round(w),Math.round(h))}function dtile(q,y,o){let a=q*T-cam.x,b=y*T-cam.y;if(o.z==='wall'){fr(a,b,T,T,P.deep);fr(a,b+2,T,T-2,P.wall);if(o.r>.55)fr(a+3,b+5,4,2,P.stone);return}if(o.z==='rock'){fr(a,b,T,T,P.f0);fr(a+2,b+5,12,8,P.deep);fr(a+3,b+3,10,8,P.stone);fr(a+5,b+4,5,2,'#5c6962');return}if(o.z==='water'){fr(a,b,T,T,P.water);if(Math.sin(t*2+q*.7+y*.4)>.15)fr(a+3,b+5,7,1,P.water2);return}fr(a,b,T,T,o.z==='moss'?P.f1:(o.r>.55?P.f1:P.f0));if(o.r>.74)fr(a+3,b+11,2,2,P.f2);if(o.r<.14)fr(a+11,b+4,1,1,P.stone);if(o.z==='moss'){fr(a+1,b+12,5,2,P.moss);if(o.r>.7)fr(a+11,b+2,2,4,P.moss2)}}
